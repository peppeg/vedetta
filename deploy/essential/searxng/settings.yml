# SearXNG for Vedetta essential (map R8). It is your SearXNG: change it freely.
# Vedetta asks only the "general" category, in JSON format, with the language of
# the question. These are the engines Vedetta was measured with: the other keyless
# web engines we tried answered with CAPTCHAs, quotas or off-topic results.
# The secret comes from SEARXNG_SECRET in .env.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo web
      - yandex

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false      # only Vedetta reaches this SearXNG
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  formats:
    - html
    - json            # Vedetta reads JSON

outgoing:
  request_timeout: 3.0
  max_request_timeout: 8.0
  pool_connections: 50
  pool_maxsize: 15
  enable_http2: true
  retries: 1

engines:
  - name: duckduckgo web
    disabled: false
    weight: 1.5
  - name: yandex
    disabled: false
    weight: 1.0
