<!doctype html>
<html lang="it" data-theme="dark" data-palette="ambra">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Vedetta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e3a74f' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 3v3M5.6 5.6l2.1 2.1M18.4 5.6l-2.1 2.1'/%3E%3Ccircle cx='12' cy='13' r='3'/%3E%3Cpath d='M3 13h2M19 13h2M7 21l5-5 5 5'/%3E%3C/svg%3E">
<script>
// Theme before first paint, so the page does not flash.
(function () {
  var g = function (k) { try { return localStorage.getItem(k) } catch (e) { return null } };
  var t = g('vedetta_theme') || 'dark';
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.palette = g('vedetta_accent') || 'ambra';
  document.documentElement.dataset.tag = g('vedetta_tag') === 'off' ? 'off' : 'on';
})();
</script>
<style>
/* ---------- tokens ---------- */
:root{
  --font: "Inter", system-ui, -apple-system, "Segoe UI", "Noto Sans", Cantarell, Roboto, sans-serif;
  --serif: "Iowan Old Style", "Charter", "Noto Serif", "DejaVu Serif", Georgia, serif;
  --mono: ui-monospace, "JetBrains Mono", "Fira Code", "Noto Sans Mono", monospace;
  --r-sm: 8px; --r: 12px; --r-lg: 20px; --r-xl: 28px;
  --side: 248px; --side-c: 64px; --top: 44px; --src: 344px;
  --ease: cubic-bezier(.2,.7,.2,1);
  --warn:#d9a441; --bad:#d9705a; --good:#5fbf7f;
}
:root[data-theme="dark"]{
  --bg:#0e0f11; --bg-2:#121316; --surface:#16181b; --surface-2:#1c1e22; --surface-3:#24272c;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#ebe8e2; --text-2:#b9b5ad; --muted:#8a867e; --faint:#5f5c56;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 40px -12px rgba(0,0,0,.6);
  --glass:rgba(18,19,22,.72); color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f5f0; --bg-2:#f1eee7; --surface:#ffffff; --surface-2:#f4f1ea; --surface-3:#ebe7de;
  --line:rgba(30,25,15,.08); --line-2:rgba(30,25,15,.14);
  --text:#1d1b18; --text-2:#45413b; --muted:#77726a; --faint:#a39e95;
  --shadow:0 1px 2px rgba(30,25,15,.05), 0 16px 40px -18px rgba(30,25,15,.22);
  --glass:rgba(247,245,240,.78); color-scheme:light;
  --warn:#a87412; --bad:#b4472f; --good:#3d8f58;
}
[data-theme="dark"][data-palette="ambra"]{--accent:#e3a74f;--accent-ink:#1a1206;--accent-soft:rgba(227,167,79,.13)}
[data-theme="dark"][data-palette="salvia"]{--accent:#93b89c;--accent-ink:#0d1a11;--accent-soft:rgba(147,184,156,.13)}
[data-theme="dark"][data-palette="terracotta"]{--accent:#e08a63;--accent-ink:#1c0e07;--accent-soft:rgba(224,138,99,.13)}
[data-theme="dark"][data-palette="iris"]{--accent:#ac9ff2;--accent-ink:#130f26;--accent-soft:rgba(172,159,242,.14)}
[data-theme="light"][data-palette="ambra"]{--accent:#a8700f;--accent-ink:#fff;--accent-soft:rgba(168,112,15,.10)}
[data-theme="light"][data-palette="salvia"]{--accent:#4c7a5a;--accent-ink:#fff;--accent-soft:rgba(76,122,90,.10)}
[data-theme="light"][data-palette="terracotta"]{--accent:#b5532b;--accent-ink:#fff;--accent-soft:rgba(181,83,43,.10)}
[data-theme="light"][data-palette="iris"]{--accent:#6552cc;--accent-ink:#fff;--accent-soft:rgba(101,82,204,.10)}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default;opacity:.5}
a{color:inherit}
svg{display:block}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--accent-soft)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.hidden{display:none!important}

/* ---------- shell ---------- */
/* Pinned to the screen: the document has nothing to scroll, so on a phone (where 100vh
   is taller than what shows) no scrollIntoView or keyboard can push the top bar away. */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--side) 1fr;transition:grid-template-columns .28s var(--ease)}
.app.collapsed{grid-template-columns:var(--side-c) 1fr}

/* sidebar */
.side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side-head{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.side-toggle{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.side-toggle:hover{background:var(--surface-2);color:var(--text)}
.side-body{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.new-btn{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);margin:4px 0 12px;white-space:nowrap;transition:border-color .2s;flex:none}
.new-btn:hover{border-color:var(--accent)}
.new-btn kbd{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.nav{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:10px;color:var(--text-2);white-space:nowrap;text-decoration:none;width:100%;flex:none}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.on{background:var(--surface-2);color:var(--text)}
.side-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px;white-space:nowrap;flex:none}
.sessions{flex:1;min-height:0;margin:0 -4px;padding:0 4px}
.sess{display:flex;align-items:center;gap:6px;border-radius:8px;color:var(--muted);font-size:13.5px}
.sess a{flex:1;min-width:0;padding:7px 4px 7px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.sess:hover{background:var(--surface-2);color:var(--text)}
.sess.on{background:var(--surface-2);color:var(--text)}
.sess .run-dot,.lib-row .run-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-right:6px;animation:stopPulse 1.4s ease-in-out infinite}
.sess .del{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--faint);opacity:0;flex:none;margin-right:3px}
.sess:hover .del,.sess .del.armed{opacity:1}
.sess .del:hover{color:var(--bad)}
.sess .del.armed{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.sess-group{font-size:11px;color:var(--faint);padding:10px 12px 4px}
.side-empty{font-size:13px;color:var(--faint);padding:6px 12px}
.side-more{display:block;width:100%;text-align:left;font-size:12.5px;color:var(--muted);padding:10px 12px 6px}
.side-more:hover{color:var(--accent)}
/* Library (map R4): every search, with a field to find them */
.library{flex:1;min-height:0}
.library-in{max-width:760px;margin:0 auto;padding:40px 24px 80px}
.library h1{font:400 30px/1.2 var(--serif);letter-spacing:-.012em;margin:0 0 20px}
.lib-find{width:100%;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:inherit;font-size:14.5px}
.lib-find:focus{outline:none;border-color:var(--accent)}
.lib-count{font-size:12.5px;color:var(--faint);margin:10px 2px 6px}
.lib-group{font-size:11.5px;color:var(--faint);padding:18px 2px 6px}
.lib-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-radius:0}
.lib-row a{flex:1;min-width:0;padding:11px 2px;text-decoration:none;color:var(--text-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-row a:hover{color:var(--text)}
.lib-row time{font-size:12px;color:var(--faint);white-space:nowrap;flex:none}
.lib-row .del{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none}
.lib-row .del:hover{color:var(--bad)}
.lib-row .del.armed{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.lib-empty{font-size:13.5px;color:var(--muted);padding:18px 2px}
.side-foot{padding:10px;border-top:1px solid var(--line);flex:none}
.app.collapsed .lbl,.app.collapsed .side-label,.app.collapsed .sessions,.app.collapsed .new-btn kbd{display:none}
.app.collapsed .side-head{padding:0 17px;justify-content:center}
.app.collapsed .side-toggle{margin:0}
.app.collapsed .brand{display:none}
.app.collapsed .new-btn,.app.collapsed .nav{justify-content:center;padding:0}

/* main + top bar */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:var(--top);display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid transparent;position:relative;z-index:20;transition:border-color .3s;flex:none}
.v-thread .top,.v-settings .top,.v-library .top,.v-setup .top{border-bottom-color:var(--line);background:var(--glass);backdrop-filter:blur(14px)}
.crumb{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;opacity:0;transition:opacity .3s}
.v-thread .crumb,.v-settings .crumb,.v-library .crumb,.v-setup .crumb{opacity:1}
.top-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.menu-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--muted);max-width:240px}
.menu-btn b{font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn:hover,.menu-btn.open{background:var(--surface-2);color:var(--text)}
.menu-btn .chev{width:14px;height:14px;opacity:.6}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 18%,transparent);flex:none}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 18%,transparent)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.dot.idle{background:var(--faint);box-shadow:none}
.dd{position:absolute;top:calc(100% + 6px);right:0;min-width:260px;max-width:340px;max-height:calc(100vh - var(--top) - 18px);max-height:calc(100dvh - var(--top) - 18px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:.16s var(--ease);z-index:50}
.dd.show{opacity:1;transform:none;pointer-events:auto}
.dd-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.dd-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px}
button.dd-i:hover{background:var(--surface-2)}
.dd-i .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-i small{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.dd-i .ok{width:16px;color:var(--accent);visibility:hidden}
.dd-i.sel .ok{visibility:visible}
.dd-i .box-ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:.15s}
.dd-i.sel .box-ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dd-i .box-ck svg{width:11px;height:11px;stroke-width:3;opacity:0}
.dd-i.sel .box-ck svg{opacity:1}
.dd-note{font-size:12px;color:var(--faint);padding:6px 10px 4px;line-height:1.45}
.rel{position:relative}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.copied{color:var(--good)}
.icon-btn.copy-failed{color:var(--warn)}
.src-toggle,.mob-menu{display:none}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 12vh}
.tag{font:400 clamp(28px,4.2vw,44px)/1.15 var(--serif);letter-spacing:-.015em;text-align:center;margin:0 0 30px;min-height:1.2em;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.tag.out{opacity:0;transform:translateY(6px)}
.tag em{font-style:italic;color:var(--accent)}
[data-tag="off"] .tag{display:none}
.home-alert{margin-top:18px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

.box{width:min(720px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:16px 14px 10px 20px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line-2))}
.box textarea{width:100%;resize:none;border:0;outline:0;background:none;color:var(--text);font:16.5px/1.5 var(--font);min-height:28px;max-height:200px;padding:2px 4px 8px 0;display:block}
.box textarea::placeholder{color:var(--faint)}
/* map R4: one row, the text and the start button (the button stays at the bottom when the text grows) */
#homeBox{display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 22px}
#homeBox textarea{padding:6px 4px 6px 0}
.go{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;transition:background .25s var(--ease),transform .15s;position:relative;flex:none}
.go .pip{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:.25s var(--ease)}
.go .arr{position:absolute;opacity:0;transform:translateX(-6px);transition:.25s var(--ease);color:var(--accent-ink)}
.go.ready{background:var(--accent)}
.go.ready .pip{opacity:0;transform:scale(.2)}
.go.ready .arr{opacity:1;transform:none}
.go:active{transform:scale(.92)}
.go.fire .arr{animation:fire .45s var(--ease)}
.go.busy{background:var(--surface-3)}
.go.busy .pip{opacity:1;transform:none;width:11px;height:11px;border-radius:3px;animation:stopPulse 1.4s ease-in-out infinite;background:var(--accent)}
@keyframes stopPulse{50%{opacity:.45}}
.go.busy .arr{opacity:0}
@keyframes fire{50%{transform:translateX(8px);opacity:0}51%{transform:translateX(-8px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}

/* ---------- thread ---------- */
.thread-wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr var(--src)}
.col{min-width:0;position:relative;min-height:0}
.col>.scroll{height:100%;padding:36px 28px 170px}
.thread{max-width:740px;margin:0 auto}
.turn{margin-bottom:56px}
.turn+.turn{padding-top:40px;border-top:1px solid var(--line)}
.q{font:400 clamp(24px,2.6vw,31px)/1.25 var(--serif);letter-spacing:-.012em;margin:0 0 22px;overflow-wrap:anywhere}

/* process */
.proc{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:30px;overflow:hidden}
.proc-h{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left}
.proc-h .chev{margin-left:auto;transition:transform .25s var(--ease);color:var(--muted)}
.proc.open .proc-h .chev{transform:rotate(180deg)}
.proc-title{font-size:14px;font-weight:500}
.proc-meta{font-size:13px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.done-ico{width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.done-ico.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.proc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.proc.open .proc-b{grid-template-rows:1fr}
.proc-b>div{overflow:hidden;min-height:0}
.tl-wrap{max-height:min(420px,55vh);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;mask-image:linear-gradient(to bottom,transparent 0,#000 14px)}
.tl{list-style:none;margin:0;padding:6px 18px 16px 18px;position:relative}
.tl li{position:relative;padding:7px 0 7px 26px;animation:in .35s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.tl li::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--line-2)}
.tl li:first-child::before{top:14px}
.tl li:last-child::before{bottom:calc(100% - 14px)}
.tl .nd{position:absolute;left:1px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--faint)}
.tl .k-search .nd,.tl .k-read .nd{border-color:var(--accent)}
.tl .k-check .nd{background:var(--accent);border-color:var(--accent)}
.tl .k-warn .nd{border-color:var(--warn)}
.think{color:var(--muted);font-size:13.5px;font-style:italic;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.think.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.think.clamp:hover{color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;height:28px;padding:0 11px 0 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.chip .ico{width:14px;height:14px;color:var(--accent)}
.chip small{color:var(--faint);margin-left:2px;overflow:hidden;text-overflow:ellipsis}
a.chip:hover{border-color:var(--line-2);color:var(--text)}
.fav{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font:600 9.5px var(--font);color:#fff;flex:none}
.stepline{font-size:13px;color:var(--text-2)}

/* answer prose */
.prose{font-size:16px;line-height:1.75;color:var(--text);overflow-wrap:anywhere}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 1.05em}
.prose h2,.prose h3,.prose h4,.prose h5{font-weight:600;letter-spacing:-.005em;line-height:1.35;margin:1.6em 0 .55em}
.prose h2{font-size:20px}
.prose h3{font-size:17px}
.prose h4,.prose h5{font-size:15.5px}
.prose strong{font-weight:600}
.prose a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.prose a:hover{border-bottom-color:var(--accent)}
.prose a.link-unread{border-bottom-style:dashed}
.prose ul,.prose ol{margin:0 0 1.05em;padding-left:1.4em}
.prose li{margin:.25em 0}
.prose li::marker{color:var(--faint)}
.prose blockquote{margin:0 0 1.05em;padding:.2em 0 .2em 1em;border-left:2px solid var(--accent-soft);color:var(--text-2)}
.prose code{font:13.5px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.1em .35em}
.prose pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow:auto;margin:0 0 1.05em}
.prose pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.6}
.prose hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.table-wrap{overflow:auto;margin:0 0 1.2em;border:1px solid var(--line);border-radius:var(--r)}
.prose table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.prose th,.prose td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.prose th{font-weight:600;background:var(--surface);color:var(--text-2);font-size:13px}
.prose tr:last-child td{border-bottom:0}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin:0 1px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font:600 11px/1 var(--font);color:var(--text-2);vertical-align:2px;cursor:pointer;transition:.15s;text-decoration:none}
.cite.unread{background:transparent;border-style:dashed;color:var(--muted)}
.cite.checked{background:transparent}
.cite:hover,.cite.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.caret{display:inline-block;width:8px;height:1.05em;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;line-height:1.5;margin:14px 0}
.banner .ico{margin-top:1px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.banner.warn .ico{color:var(--warn)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.banner.bad .ico{color:var(--bad)}
.banner small{display:block;color:var(--muted);margin-top:2px}
.banner .act{margin-left:auto;flex:none;height:30px;padding:0 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:500}
.answer-foot{display:flex;align-items:center;gap:4px;margin-top:14px;flex-wrap:wrap;position:relative}
/* the menus of «Copia» and «Stampa»: two choices each (Piano fase 6 chiusura, B3 and C4) */
.pmenu{position:absolute;right:0;bottom:38px;z-index:40;width:min(300px,calc(100vw - 32px));padding:6px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.pmenu[hidden]{display:none}
.pmenu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px}
.pmenu button:hover,.pmenu button:focus-visible{background:var(--surface-2)}
.pmenu b{display:block;font-weight:600;font-size:14px;color:var(--text)}
.pmenu small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.badge.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.badge .ico{width:13px;height:13px}
.answer-foot .sp{flex:1}
.print-prov,.print-links{display:none}
.notes{margin-top:22px;border-top:1px solid var(--line);padding-top:4px}
.notes summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:10px 0}
.notes summary::-webkit-details-marker{display:none}
.notes summary:hover{color:var(--text)}
.notes summary .chev{transition:transform .2s}
.notes[open] summary .chev{transform:rotate(180deg)}
.notes .prose{font-size:13.5px;line-height:1.6;color:var(--muted)}
.notes .prose em{font-style:normal}
.notes .prose blockquote{border-left-color:var(--line-2);color:var(--muted)}
/* a sentence with a number found in no page read (Piano dopo audit 4.2) */
.prose .miss{background:color-mix(in srgb,var(--warn) 8%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 8%,transparent);border-radius:3px;cursor:help}
.prose .miss:hover,.prose .miss.hot{background:color-mix(in srgb,var(--warn) 15%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 15%,transparent)}
.miss-tip{position:absolute;z-index:60;max-width:min(320px,86vw);padding:9px 11px;border-radius:9px;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px;line-height:1.45}
.notes-flag{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:500;margin-left:2px}
.notes-flag .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* follow-up */
.follow{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 22px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
.follow .box{margin:0 auto;max-width:740px;padding:8px 8px 8px 18px;border-radius:26px;display:flex;align-items:flex-end;gap:2px}
.follow textarea{min-height:24px;padding:6px 0;font-size:15px}
.follow .go{width:36px;height:36px;margin-left:2px}

/* sources panel */
.srcp{border-left:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;min-height:0}
.srcp-h{padding:16px 16px 10px;flex:none}
.srcp-title{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:14px;margin-bottom:12px}
.srcp-title span{color:var(--faint);font-weight:400}
.srcp-title .x{margin-left:auto;display:none}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:28px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button i{font-style:normal;color:var(--faint);margin-left:4px}
.find{display:flex;align-items:center;gap:8px;height:34px;margin-top:8px;padding:0 10px;border-radius:10px;border:1px solid var(--line);color:var(--faint)}
.find input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:13px var(--font)}
.find:focus-within{border-color:var(--line-2)}
.srcp-meta{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.45}
.srcl{flex:1;min-height:0;padding:4px 10px 24px}
.src{display:block;width:100%;text-align:left;padding:11px 10px;border-radius:12px;transition:background .15s;border:1px solid transparent;cursor:pointer}
.src:hover{background:var(--surface-2)}
.src.hot{background:var(--accent-soft)}
.src.open{background:var(--surface);border-color:var(--line)}
.src.pick{background:var(--accent-soft);border-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
.src.pick .src-n{color:var(--accent)}
.src.flash{animation:srcflash 1.2s var(--ease)}
@keyframes srcflash{0%,35%{box-shadow:inset 3px 0 0 var(--accent),0 0 0 2px var(--accent)}100%{box-shadow:inset 3px 0 0 var(--accent),0 0 0 2px transparent}}
.src-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.src-top .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-n{font:600 11px var(--font);color:var(--faint);min-width:16px}
.src-t{font-size:13.5px;line-height:1.4;color:var(--text);margin:5px 0 0 24px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tagx{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);margin-left:auto;flex:none}
.tagx.read{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.tagx.unread{border-style:dashed}
.unread-note{margin:10px 0 0 24px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.src-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.src.open .src-x{grid-template-rows:1fr}
.src-x>div{overflow:hidden;min-height:0}
.src-x p{margin:10px 0 8px 24px;font-size:13px;line-height:1.6;color:var(--text-2);border-left:2px solid var(--accent-soft);padding-left:10px;overflow-wrap:anywhere}
.src-x a{margin-left:24px;font-size:12.5px;color:var(--accent);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.empty{color:var(--faint);font-size:13px;padding:20px 10px;line-height:1.5}

/* settings */
.settings{flex:1;min-height:0}
.settings-in{max-width:680px;margin:0 auto;padding:40px 24px 80px}
.settings h1{font:400 30px/1.2 var(--serif);letter-spacing:-.012em;margin:0 0 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:600;margin:0 0 4px}
.card p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.row{display:flex;align-items:center;gap:16px;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.row .k{flex:1;font-size:14px}
.row .k small{display:block;color:var(--muted);font-size:12.5px}
.pills{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.pills button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.pills button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.swatches{display:flex;gap:10px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.swatch span{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line-2);transition:.15s}
.swatch.on{color:var(--text)}
.swatch.on span{outline:2px solid var(--text-2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.kv{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.kv b{font-weight:500;color:var(--text-2)}

.mob-only{display:none}
.paid-note{font-size:12.5px;color:var(--muted);text-align:center;margin:10px auto 0;max-width:720px;display:flex;gap:6px;justify-content:center;align-items:center}
.follow .paid-note{margin:0 auto 8px}
.paid{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:5px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font:600 10.5px/1 var(--font);flex:none}
.dd-i.dis{opacity:.55}
.dd-i.dis small{color:var(--muted)}
.dd-i .def{font-size:10.5px;color:var(--faint);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;flex:none}
.svc-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:18px 0 2px}
.svc{padding:12px 0;border-top:1px solid var(--line)}
.svc-top{display:flex;align-items:center;gap:10px;min-width:0}
.svc-name{font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.svc-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc-st{font-size:12px;color:var(--faint);white-space:nowrap}
.svc-st.bad{color:var(--bad)}.svc-st.good{color:var(--good)}
.svc-acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.svc-sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.svc-sub input,.svc-sub select,.addm select,.addm input{height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);padding:0 10px;font:13px var(--font);min-width:0;flex:1 1 220px}
.svc-sub input:focus,.addm select:focus,.addm input:focus{outline:none;border-color:var(--accent)}
.svc-sub label{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;min-width:0}
.svc-sub label input,.svc-sub label select{flex:none;width:100%}
.mfield{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;min-width:0}
.mrow{display:flex;gap:6px;align-items:center;min-width:0}
.mrow input{flex:1 1 auto;min-width:0;width:100%}
.mrow .mini{flex:none;height:32px}
.mwarn{flex:1 1 100%;font-size:12px;line-height:1.4;color:var(--warn)}
.mwarn:empty{display:none}
.mlist{margin-top:8px;padding:8px;border:1px solid var(--line-2);border-radius:10px}
.mfilters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mfilters input{flex:1 1 170px;min-width:0;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);padding:0 10px;font:13px var(--font,inherit)}
.mfilters input:focus{outline:none;border-color:var(--accent)}
.mcount{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.mitems{max-height:280px;overflow-y:auto;margin-top:6px;overscroll-behavior:contain}
.mitem{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;justify-content:space-between;width:100%;padding:7px 8px;border-radius:7px;text-align:left;font-size:13px;color:var(--text)}
.mitem:hover,.mitem.sel{background:var(--accent-soft)}
.mid{min-width:0;overflow-wrap:anywhere}
.mtags{display:flex;flex-wrap:wrap;gap:4px}
.mtag{padding:1px 6px;border-radius:5px;border:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap}
.mtag.free{color:var(--good)}
.mtag.warn{color:var(--warn)}
.mnote{margin-top:8px;font-size:12px;line-height:1.4;color:var(--muted)}
.mnone{padding:10px 8px;font-size:13px;color:var(--muted)}
.mini{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);font-size:12.5px;color:var(--text-2);background:var(--surface-2);white-space:nowrap}
.mini:hover{border-color:var(--accent)}
.mini.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.mini:disabled{opacity:.4;cursor:default;border-color:var(--line-2)}
.toggle{width:36px;height:21px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s;flex:none}
.toggle span{position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--text-2);transition:transform .2s var(--ease)}
.toggle.on{background:var(--accent)}
.toggle.on span{transform:translateX(15px);background:var(--accent-ink)}
.toggle:disabled{opacity:.4;cursor:default}
.paidfb{border-top:1px solid var(--line);margin-top:6px}
.addm{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#lockCard .addm{margin-top:0}
/* access code (map R6): asked once per device, remembered for a year */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:16px}
.gate.hidden{display:none}
.gate-in{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 24px}
.gate-in h1{font:400 26px/1.2 var(--serif);margin:0 0 10px}
.gate-in p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
.gate-in .addm{margin-top:0}
.gate-msg{display:block;margin-top:10px;font-size:13px;color:var(--bad);min-height:1em}
#accessCard .warn-line{color:var(--warn)}
#accessEdit .row{flex-wrap:wrap}
#accessEdit .row .k small{margin-top:3px;line-height:1.45}
#accessEdit .addm{margin:4px 0 0;width:100%}
#accessEdit .addm input{flex:1 1 200px}
#accessEdit .btn.armed{color:var(--bad);border-color:var(--bad)}
#accessMsg{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
#accessMsg:empty{display:none}
#accessMsg.bad{color:var(--bad)}
#lockMsg{display:block;margin-top:10px;font-size:13px;color:var(--bad)}
.savebar{position:sticky;bottom:16px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px 12px 10px 16px;font-size:13px;color:var(--muted)}
.savebar #saveMsg{flex:1;min-width:0}
.savebar #saveMsg.bad{color:var(--bad)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{border-color:var(--line-2)}
.btn.armed{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
#memMsg{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
#memMsg:empty{display:none}
#memMsg.bad{color:var(--bad)}
#expCard .row .k small,#dataCard .row .k small{margin-top:3px;line-height:1.45}
#dataCard ul{margin:0 0 12px;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.55}
#dataCard code{font-size:12.5px;overflow-wrap:anywhere}
#dataMsg{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
#dataMsg:empty{display:none}
#dataMsg.bad{color:var(--bad)}
#expMsg{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
#expMsg:empty{display:none}
#expMsg.bad{color:var(--bad)}
.view{display:none}
.v-home .home{display:flex}
.v-settings .settings{display:block}
.v-library .library{display:block}
.v-thread .thread-wrap{display:grid}
.v-setup .setup{display:block}
/* first run (map R8) */
.setup .lead{color:var(--muted);font-size:14px;margin:-4px 0 22px}
.found{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.found.off{cursor:default}
.found>input{margin-top:3px;accent-color:var(--accent);flex:none}
.found .f-main{flex:1;min-width:0}
.found .f-url{font-size:14px;overflow-wrap:anywhere}
.found .f-st{font-size:12.5px;color:var(--muted)}
.found .f-st.good{color:var(--good)}.found .f-st.bad{color:var(--warn)}
.found .svc-sub{margin-top:6px}
.su-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.su-note.bad{color:var(--warn)}
.svc-doc{flex-basis:100%;color:var(--warn)}
#setupMsg{flex:1;min-width:0}#setupMsg.bad{color:var(--bad)}

/* responsive */
@media (max-width:1100px){
  .thread-wrap{grid-template-columns:1fr!important}
  .srcp{position:fixed;top:var(--top);right:0;bottom:0;width:min(var(--src),92vw);z-index:30;transform:translateX(100%);transition:transform .3s var(--ease);box-shadow:var(--shadow)}
  .srcp.show{transform:none}
  .srcp-title .x{display:grid}
  .v-thread .src-toggle{display:flex}
}
@media (max-width:760px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:60;transform:translateX(-100%);transition:transform .28s var(--ease);box-shadow:var(--shadow)}
  .app.mob-open .side{transform:none}
  .app.mob-open::after{content:'';position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45)}
  .app.collapsed .lbl,.app.collapsed .side-label{display:revert}
  .app.collapsed .sessions{display:block}
  .app.collapsed .brand{display:flex}
  .app.collapsed .new-btn,.app.collapsed .nav{justify-content:flex-start;padding:0 12px}
  .mob-menu{display:grid}
  .desk-only{display:none}
  .mob-only{display:block}
  .settings-in{padding:28px 16px 80px}
  .svc-top{flex-wrap:wrap}
  .menu-btn .lbl-k{display:none}
  .menu-btn{max-width:150px}
  .top-right .rel{position:static} /* a menu is placed on the bar, not on its button: it stays inside a narrow screen */
  .top .dd{left:10px;right:10px;min-width:0;max-width:none}
  .col>.scroll{padding:26px 16px 160px}
  .follow{padding:14px 12px 16px}
}
/* no hover on a touch screen: the trash must be visible to be reachable */
@media (hover:none){.sess .del{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* print (Piano fase 6 chiusura, B3): a light sheet in both themes, no bars, panels or buttons; a page
   breaks between lines, never inside a list item, a table row or a code block, and not after a title.
   Ctrl+P prints the thread as it is on the screen; the «Stampa» button prints one answer, with or without its notes. */
@page{size:A4;margin:2cm}
@media print{
  :root,:root[data-theme]{--bg:#fff;--bg-2:#fff;--surface:#fff;--surface-2:#f4f1ea;--surface-3:#ebe7de;--line:rgba(30,25,15,.16);--line-2:rgba(30,25,15,.24);
    --text:#1b1a18;--text-2:#3d3a35;--muted:#55524c;--faint:#77726a;--warn:#a87412;--accent:#1b1a18;--accent-soft:rgba(30,25,15,.12);color-scheme:light}
  html,body{height:auto;overflow:visible;background:#fff;color:var(--text)}
  .app{position:static;display:block}
  .main{display:block}
  .side,.top,.follow,.srcp,.proc,.banners,.answer-foot,.pmenu,.miss-tip,.notes summary svg{display:none!important}
  .v-thread .thread-wrap{display:block}
  .col,.col>.scroll{position:static;height:auto;overflow:visible;padding:0}
  .thread{max-width:none}
  .turn{margin:0 0 24pt}
  .turn+.turn{padding-top:18pt}
  .q{font-size:18pt;margin:0 0 12pt;break-after:avoid}
  .prose{font-size:11pt;line-height:1.5}
  .prose a{color:inherit;border-bottom-color:var(--line-2)}
  .prose pre{white-space:pre-wrap;overflow:visible}
  .table-wrap{overflow:visible}
  .prose li,.prose tr,.prose pre,.prose blockquote,.prose img{break-inside:avoid}
  .prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose p:has(> strong:only-child){break-after:avoid}
  .prose p,.prose li{orphans:3;widows:3}
  .prose thead{display:table-header-group}
  .notes{margin-top:18pt;padding-top:6pt}
  .notes summary{font-size:12pt;font-weight:600;color:var(--text);padding:0 0 6pt;break-after:avoid}
  .notes .prose{font-size:9.5pt}
  .prose .miss{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#f6e7c4;box-shadow:0 0 0 2px #f6e7c4}
  /* the provenance of an answer from memory, partial or with fewer sources; the full report has it in the notes */
  .print-prov{display:block;margin:12pt 0 0;padding:2pt 0 2pt 8pt;border-left:2pt solid var(--warn);font-size:10pt;color:var(--text-2);break-inside:avoid}
  [data-print="full"] .print-target .print-prov{display:none}
  /* the full report: the addresses of the answer's links the notes do not have (C6) */
  .print-links{display:block;margin-top:14pt}
  .print-links.prose{font-size:9.5pt}
  .print-links h3{font-size:12pt;margin:0 0 4pt;break-after:avoid}
  .print-links li{break-inside:avoid}
  .print-links .u{overflow-wrap:anywhere;color:var(--muted)}
  /* on paper a source number points to nothing: the site's name takes its place */
  .cite[data-host]{display:inline-block;font-size:0;line-height:1;min-width:0;height:auto;padding:1px 4px;vertical-align:baseline;background:transparent;border-color:var(--line-2)}
  .cite[data-host]::after{content:attr(data-host);font:500 8pt/1.3 var(--font);color:var(--muted)}
  /* a link of the answer that is not a source has no pill: its site's name follows its words (C8) */
  .answer a[data-host]::after{content:attr(data-host);display:inline-block;margin-left:3px;padding:1px 4px;border:1px solid var(--line-2);border-radius:6px;font:500 8pt/1.3 var(--font);color:var(--muted);vertical-align:baseline}
  /* the «Stampa» button: only that answer; the notes all open for the full report, with the links' addresses */
  .printing .turn:not(.print-target){display:none}
  .printing .turn.print-target{border-top:0;padding-top:0}
  [data-print="answer"] .print-target .notes{display:none}
  [data-print="full"] .print-target .notes a[href^="http"]::after{content:" (" attr(href) ")";font-size:8.5pt;overflow-wrap:anywhere}
  [data-print="full"] .print-target .notes .cite{display:none}
}

    const state = ctx && ctx.stateOf ? ctx.stateOf(raw) : '';

  s = s.replace(/\(\s*((?:\u0001[^\u0001]*\u0001\s*[,;]?\s*)+)\)/g, (m, g) => g.replace(/\s*[,;]\s*/g, '').replace(/\u0001/g, '\u0002'));

  after.innerHTML = `<div class="answer-foot">${prov ? `<span class="badge ${provCls}">${prov === 'grounded' || prov === 'anchored' ? ICON.shield : ICON.info}${esc(provText)}</span>` : ''}<span class="sp"></span>

/* ---------- copy and print (Piano fase 6 chiusura, B3 and C4) ---------- */
// The clipboard API exists only on https or on the computer itself: a page opened as
// http://name-of-the-server from another device does not have it (from Windows
// «Copy» did nothing). There the old way, a selected textarea and the copy
// command, still works inside the click.
async function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true } catch {}
  }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.focus({ preventScroll: true }); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy') } catch {}
  ta.remove();
  return ok;
}
// The button says how it went for a moment: a tick when copied, a warning and the reason when not.
function showCopied(btn, ok) {
  clearTimeout(btn._copyTimer);
  btn.classList.toggle('copied', ok); btn.classList.toggle('copy-failed', !ok);
  btn.innerHTML = ok ? ICON.check : ICON.warn;
  btn.title = ok ? t('copied') : t('copy_failed');
  btn._copyTimer = setTimeout(() => {
    btn.classList.remove('copied', 'copy-failed'); btn.innerHTML = ICON.copy; btn.title = t('copy');
  }, ok ? 1600 : 6000);
  btn.focus({ preventScroll: true });
}
function closeFootMenus() {
  $$('.pmenu').forEach(m => { m.hidden = true });
  $$('.answer-foot .print, .answer-foot .copy').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
document.addEventListener('click', e => { if (!e.target.closest || !e.target.closest('.pmenu')) closeFootMenus() });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFootMenus() });
// what «Copia» puts in the clipboard: kind "answer" (the answer's text, as before) or "full" (the
// answer and all its notes, as Go wrote them), in Markdown
function copyText(tr, kind) {
  const body = tr.body || tr.raw;
  if (kind === 'full' && tr.notes) return `${body}\n\n---\n\n${tr.notes}`;
  return tr.provWarn ? `${body}\n\n> ${tr.provWarn}` : body;
}
// prints one answer: kind "answer" (the question and the answer) or "full" (with all its notes, open
// only for the print, then as they were); the print rules are in @media print
let printRestore = null;
function printTurn(tr, kind) {
  if (printRestore) printRestore();
  const opened = kind === 'full' ? [...tr.el.querySelectorAll('details.notes:not([open])')] : [];
  opened.forEach(d => { d.open = true });
  const links = kind === 'full' ? printLinks(tr) : null;
  root.classList.add('printing'); root.dataset.print = kind; tr.el.classList.add('print-target');
  const mq = window.matchMedia ? window.matchMedia('print') : null;
  const done = () => { if (printRestore) printRestore() };
  const change = e => { if (!e.matches) done() };
  printRestore = () => {
    printRestore = null;
    opened.forEach(d => { d.open = false });
    links?.remove();
    root.classList.remove('printing'); delete root.dataset.print; tr.el.classList.remove('print-target');
    window.removeEventListener('afterprint', done); mq?.removeEventListener?.('change', change);
  };
  window.addEventListener('afterprint', done); mq?.addEventListener?.('change', change);
  window.print();
}
// On paper a link is its site's name: the full report lists, under the notes, the addresses of the
// answer's links that the notes do not already print (pages not read, or cited by number), in the
// answer's order, each once. Returns the list put on the page, or null.
function printLinks(tr) {
  const inNotes = new Set([...tr.el.querySelectorAll('.notes a[href^="http"]')].map(a => normURL(a.href)));
  const seen = new Set(), items = [];
  const short = s => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > 90 ? s.slice(0, 88).replace(/\s+\S*$/, '') + '…' : s };
  const add = (url, label) => {
    const k = normURL(url);
    if (!/^https?:\/\//i.test(url) || inNotes.has(k) || seen.has(k)) return;
    seen.add(k); items.push(`<li>${esc(short(label) || host(url))} — <span class="u">${esc(url)}</span></li>`);
  };
  tr.q('.answer').querySelectorAll('a[href^="http"], .cite[data-n]').forEach(el => {
    if (el.tagName === 'A') { add(el.getAttribute('href'), el.textContent); return }
    const src = tr.sources[+el.dataset.n - 1];
    if (src) add(src.url, src.title);
  });
  if (!items.length) return null;
  const box = document.createElement('div');
  box.className = 'print-links prose';
  box.innerHTML = `<h3>${esc(t('print_links'))}</h3><p><em>${esc(t('print_links_hint'))}</em></p><ol>${items.join('')}</ol>`;
  tr.q('.after').appendChild(box);
  return box;
}
function banner(tr, kind, title, detail, action) {

  el.innerHTML = `${kind === 'error' ? ICON.warn : ICON.info}<div>${esc(title)}${detail ? `<small>${esc(detail)}</small>` : ''}</div>${action ? `<button class="act">${esc(action.label)}</button>` : ''}`;

/* ---------- live research ---------- */
const urlIn = s => (String(s).match(/https?:\/\/[^\s)]+/) || [])[0] || '';
const afterColon = s => { const i = String(s).indexOf(': '); return i >= 0 ? s.slice(i + 2) : s };

async function startSearch(query, opts = {}) {
  if (busy) return;
  if (!opts.followUp) { turns = []; $('#thread').innerHTML = ''; sessionId = null }
  setView('thread'); $('#crumb').textContent = opts.followUp ? ($('#crumb').textContent || query) : query;
  const tr = makeTurn(query); setActive(tr); activeTurn = tr; renderSources();
  tr.sid = sessionId;
  setProc(tr, 'run', t('p_planning'));
  // Only the thread column scrolls: scrollIntoView would move every ancestor too.
  const col = $('#col');
  col.scrollTo({ top: col.scrollTop + tr.el.getBoundingClientRect().top - col.getBoundingClientRect().top, behavior: 'smooth' });
  // One way only since map R1: every research is the Deep a ciclo.
  const body = JSON.stringify({ session_id: sessionId || undefined, query, mode: 'deep', language: lang,
    search_provider: svc ? curId('search') : undefined, reader: svc ? curId('reader') : undefined, llm_endpoint: svc ? curId('llm') : undefined });
  await runTurn(tr, signal => fetch('/api/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, signal }));
}

/* The search lives on the server. A phone that sleeps loses the connection, not the
   search: when the page is back, it reads the events it missed. */
const RECONNECT_TRIES = 40;
let live = null; // the stream being read: { tr, ctrl, last }

async function runTurn(tr, firstRequest) {
  busy = true; syncGo();
  tr.seq = 0; tr.ended = false;
  let outcome = 'ended';
  try {
    outcome = await followRun(tr, firstRequest);
  } catch (err) {
    if (!tr.detached) banner(tr, 'error', t('http_error'), String(err.message || err));
  }
  if (tr.detached) return; // the user went elsewhere; the search goes on without this page
  live = null;
  if (outcome === 'gone') { // over while we were away: the answer is in the session
    busy = false; syncGo(); loadSessions();
    await openSession(tr.sid, true);
    return;
  }
  if (!tr.raw.trim() && tr.stopped) banner(tr, 'info', t('stopped_empty'), '', { label: t('retry'), run: () => startSearch(tr.query) });
  else if (!tr.raw.trim() && !tr.q('.b-error')) banner(tr, 'error', t('no_answer'));
  finishTurn(tr);
  tr.q('.proc').classList.remove('open');
  busy = false; syncGo(); loadSessions();
}

// Stop following the search on screen, because the user is going elsewhere. It keeps
// running on the server: the session list marks it and opening it follows it again.
function leaveRun() {
  if (!live) return;
  live.tr.detached = true; live.ctrl.abort(); live = null;
  busy = false; syncGo();
}

async function stopSearch() {
  const tr = live?.tr;
  if (!tr?.sid || tr.stopped) return; // no session yet for a few milliseconds: nothing to name
  tr.stopped = true;
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(tr.sid)}/stop`, { method: 'POST' });
    if (!r.ok && r.status !== 404) tr.stopped = false;
  } catch { tr.stopped = false }
}

async function followRun(tr, firstRequest) {
  const resume = signal => fetch(`/api/sessions/${encodeURIComponent(tr.sid)}/stream?from=${tr.seq}`, { signal });
  let request = firstRequest || resume, wait = 500, fails = 0;
  for (;;) {
    if (tr.detached) return 'detached';
    const ctrl = new AbortController();
    live = { tr, ctrl, last: Date.now() };
    let failure = null;
    try {
      const res = await request(ctrl.signal);
      if (request === resume && res.status === 404) return 'gone';
      if (!res.ok || !res.body) {
        const j = await res.json().catch(() => ({}));
        failure = new Error(res.status === 409 ? t('busy_session') : j.error || 'HTTP ' + res.status);
        if (request !== resume) throw Object.assign(failure, { final: true }); // the server said no: nothing to retry
      } else {
        wait = 500; fails = 0;
        await readEvents(tr, res);
        if (tr.ended) return 'ended';
      }
    } catch (err) {
      if (err.final) throw err;
      failure = err;
    }
    if (tr.ended) return 'ended';
    if (tr.detached) return 'detached';
    if (!tr.sid) throw failure || new Error('connection lost'); // lost before the session existed
    await whenVisible();
    if (++fails > RECONNECT_TRIES) throw failure || new Error('connection lost');
    await new Promise(r => setTimeout(r, wait));
    wait = Math.min(wait * 2, 15000);
    request = resume;
  }
}

async function readEvents(tr, res) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) return;
    if (live) live.last = Date.now();
    buf += dec.decode(value, { stream: true });
    const blocks = buf.split('\n\n'); buf = blocks.pop();
    for (const b of blocks) {
      if (!b.trim() || tr.detached) continue;
      let type = 'message'; const data = [];
      for (const line of b.split('\n')) {
        if (line.startsWith('event:')) type = line.slice(6).trim();
        else if (line.startsWith('data:')) data.push(line.slice(line.startsWith('data: ') ? 6 : 5));
      }
      tr.seq++; // the position to come back to: only whole events count
      onEvent(tr, type, data.join('\n'));
    }
  }
}

const whenVisible = () => document.hidden ? new Promise(resolve => {
  const check = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', check); resolve() } };
  document.addEventListener('visibilitychange', check);
}) : Promise.resolve();

// A connection that died silently never reports it: drop a quiet stream and ask for
// the rest. Asking again loses nothing, so it is safe when it was only a long pause.
const dropQuietStream = quietMs => { if (live && live.tr.sid && Date.now() - live.last > quietMs) live.ctrl.abort() };
document.addEventListener('visibilitychange', () => { if (!document.hidden) dropQuietStream(3000) });
window.addEventListener('online', () => dropQuietStream(0));
setInterval(() => { if (!document.hidden) dropQuietStream(45000) }, 5000);

function onEvent(tr, type, data) {
  const J = () => { try { return JSON.parse(data) } catch { return null } };
  switch (type) {
    case 'end': tr.ended = true; break;
    case 'session': { const d = J(); if (d?.session_id) { sessionId = tr.sid = d.session_id; const url = '?session=' + sessionId; if (location.search !== url) history.pushState({}, '', url); loadSessions() } break }
    case 'step': {
      const d = J() || {}; const msg = d.message || d.step || '';
      if (d.step === 'searching') {
        tr.searches++; procItem(tr, 'search', searchChip(afterColon(msg))); setProc(tr, 'run', t('p_searching'));
      } else if (d.step === 'reading') {
        const u = urlIn(msg);
        if (u && !tr.read.has(normURL(u))) { tr.read.add(normURL(u)); tr.reads++; procItem(tr, 'read', readChip(u, '')); if (tr === activeTurn) renderSources() }
        setProc(tr, 'run', t('p_reading'));
      } else if (d.step === 'deep_critic') {
        procItem(tr, 'check', `<div class="stepline">${esc(msg)}</div>`); setProc(tr, 'run', t('p_checking'));
      } else if (d.step === 'synthesizing' || d.step === 'sections') {
        procItem(tr, 'step', `<div class="stepline">${esc(msg)}</div>`); setProc(tr, 'run', t('p_writing'));
      } else if (/fallback|no_sources|gap|contradictions|warning/.test(d.step || '')) {
        procItem(tr, 'warn', `<div class="stepline">${esc(msg)}</div>`);
      } else if (msg) {
        procItem(tr, 'step', `<div class="stepline">${esc(msg)}</div>`);
        setProc(tr, 'run', d.step === 'planning' || d.step === 'reformulating' ? t('p_planning') : t('p_thinking'));
      }
      break;
    }
    case 'subqueries': { const list = J(); if (Array.isArray(list)) list.forEach(sq => { tr.searches++; procItem(tr, 'search', searchChip(sq.query || sq)) }); setProc(tr, 'run'); break }
    case 'fact': tr.facts++; setProc(tr, 'run'); break;
    case 'sources': {
      const d = J(); const list = Array.isArray(d) ? d : (d?.sources || []);
      if (d && !Array.isArray(d)) tr.providerMeta = d;
      tr.sources = list.filter(s => s && s.url);
      if (tr === activeTurn) renderSources();
      if (tr.raw) scheduleRender(tr);
      break;
    }
    case 'reasoning': addThinking(tr, data); if (!tr.raw) setProc(tr, 'run', t('p_thinking')); break;
    case 'token':
      if (!tr.raw) { tr.q('.proc').classList.remove('open'); if (tr.thinkEl) { tr.thinkEl.classList.add('clamp'); tr.thinkEl = null } setProc(tr, 'run', t('p_writing')) }
      tr.raw += data; scheduleRender(tr); break;
    case 'bibliography': tr.raw += data; break;
    case 'warning': {
      const d = J() || { warning: data };
      if (d.kind === 'partial') { tr.partial = true; banner(tr, 'partial', d.warning || t('p_partial'), d.details) }
      else banner(tr, d.kind || 'info', d.warning || d.error || '', d.details);
      break;
    }
    case 'done': {
      const d = J() || {}; tr.provenance = d.provenance || ''; if (d.partial) tr.partial = true;
      if (d.loop_calls) tr.loopAnswer = true;
      if (Array.isArray(d.pages_read)) { tr.read = new Set(d.pages_read.map(normURL)); tr.reads = tr.read.size } // the steps name a page before reading it
      tr.linkStates = linkStatesMap(d.link_states);
      tr.numbersMissing = Array.isArray(d.numbers_missing) ? d.numbers_missing : null;
      break;
    }
    case 'error': { if (tr.stopped) break; const d = J(); banner(tr, 'error', (d && (d.error || d.message)) || data); break }
  }
}

/* ---------- stored sessions ---------- */
let sessions = [], armed = null;
async function loadSessions() {
  try { const r = await fetch('/api/sessions?days=8'); if (r.ok) sessions = await r.json() || [] } catch { }
  renderSessions();
}
function renderSessions() {
  const el = $('#sessions'); if (!el) return;
  // map R4: the sidebar keeps the last 7 days; every search is in the Library
  const more = `<button class="side-more" data-library>${esc(t('side_more'))}</button>`;
  const recent = sessions.filter(s => dayGroup(s.updated_at || s.created_at) !== 'older');
  if (!recent.length) { el.innerHTML = `<div class="side-empty">${esc(t('side_none_recent'))}</div>` + more; return }
  let html = '', last = '';
  recent.forEach(s => {
    const g = dayGroup(s.updated_at || s.created_at);
    if (g !== last) { html += `<div class="sess-group">${esc(t(g))}</div>`; last = g }
    html += `<div class="sess ${s.id === sessionId ? 'on' : ''}" data-id="${esc(s.id)}"><a href="?session=${esc(s.id)}" title="${esc(s.title)}">${esc(s.title || t('new_search'))}</a>${s.live ? `<span class="run-dot" title="${esc(t('running'))}"></span>` : ''}<button class="del${armed === s.id ? ' armed' : ''}" title="${esc(t('confirm_delete'))}">${ICON.trash}</button></div>`;
  });
  el.innerHTML = html + more;
}
// today, yesterday, the last 7 days, older
function dayGroup(ts) {
  const day = 864e5, now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const x = new Date(ts).getTime();
  return x >= start ? 'today' : x >= start - day ? 'yesterday' : x >= start - 6 * day ? 'week' : 'older';
}
$('#sessions').addEventListener('click', async e => {
  if (e.target.closest('[data-library]')) { openLibrary(); return }
  const row = e.target.closest('.sess'); if (!row) return;
  const id = row.dataset.id;
  if (e.target.closest('.del')) {
    e.preventDefault();
    const btn = e.target.closest('.del');
    if (armed !== id) { $$('.sess .del.armed').forEach(b => b.classList.remove('armed')); armed = id; btn.classList.add('armed'); setTimeout(() => { if (armed === id) { armed = null; btn.classList.remove('armed') } }, 3000); return }
    armed = null;
    if (live?.tr.sid === id) leaveRun();
    try { await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' }) } catch { }
    if (id === sessionId) goHome();
    loadSessions(); return;
  }
  e.preventDefault(); openSession(id);
});
let openSeq = 0; // the last click wins when two sessions are opened in a row
async function openSession(id, noPush) {
  const seq = ++openSeq;
  if (live?.tr.sid === id) { setView('thread'); $('#crumb').textContent = live.tr.query; return } // already following it
  let s; try { const r = await fetch('/api/sessions/' + encodeURIComponent(id)); if (!r.ok) return; s = await r.json() } catch { return }
  if (seq !== openSeq) return;
  leaveRun();
  sessionId = s.id; if (!noPush) history.pushState({}, '', '?session=' + s.id);
  turns = []; $('#thread').innerHTML = ''; setView('thread'); $('#crumb').textContent = s.title || '';
  const msgs = (s.messages || []).filter(m => m.role === 'assistant');
  if (!msgs.length && !s.live) {
    const tr = makeTurn(s.title || ''); tr.stored = true; tr.q('.proc').classList.add('hidden');
    banner(tr, 'error', t('empty_session'), '', { label: t('retry'), run: () => startSearch(s.title) });
  }
  msgs.forEach(m => {
    const tr = makeTurn(m.query || s.title || ''); tr.stored = true;
    const meta = m.meta || {}; tr.meta = meta; tr.provenance = meta.provenance || ''; tr.partial = !!meta.partial;
    tr.sources = (Array.isArray(m.sources) ? m.sources : []).filter(x => x && x.url);
    const loop = meta.loop;
    tr.loopAnswer = !!(loop && loop.calls);
    tr.linkStates = linkStatesMap(loop && loop.link_states);
    tr.numbersMissing = loop && Array.isArray(loop.numbers_missing) ? loop.numbers_missing : null;
    if (tr.loopAnswer && tr.provenance === 'grounded') tr.provenance = 'researched';
    if (m.thinking) { addThinking(tr, m.thinking); tr.thinkEl.classList.add('clamp'); tr.thinkEl = null }
    if (loop && Array.isArray(loop.calls_detail)) {
      loop.calls_detail.forEach(c => {
        if (c.tool === 'search' && c.query) { tr.searches++; procItem(tr, 'search', searchChip(c.query)) }

}

    <label>${esc(t('key'))}<input type="password" autocomplete="off" data-sum="key" value="${esc(m.key)}" placeholder="${esc(t(m.has_key ? 'su_key_kept' : 'su_key_ph'))}"></label>
    <div class="mfield"><span>${esc(t('model_id'))}</span><div class="mrow"><input data-sum="model" list="suModels" autocomplete="off" value="${esc(m.model)}" placeholder="${esc(t('su_model_ph'))}"><button class="mini" data-su="list">${esc(t('su_list'))}</button></div></div>
  </div><datalist id="suModels"></datalist><div class="su-note" id="suModelSt"></div>`;
  suModelUI();
  // 4. access
  $('#suAccessDesc').textContent = t(access?.exposed ? 'su_access_open' : 'su_access_local');
  $('#suAccess').innerHTML = access?.code_source === 'env' ? `<div class="su-note">${esc(t('code_env'))}</div>`
    : access?.required ? `<div class="su-note">${esc(t('su_access_has'))}</div>`
    : `<div class="addm" style="margin-top:0"><input type="password" autocomplete="new-password" id="suCode" placeholder="${esc(t('code_ph'))}" value="${esc(su.code)}"></div><div class="su-note">${esc(t('su_code_note'))}</div>`;
}
async function suList() {
  const m = su.llm, seq = m.seq = (m.seq || 0) + 1;
  if (!m.base_url.trim()) { m.listState = 'down'; suModelUI(); return }
  m.listState = 'loading'; suModelUI();
  let res;
  try {
    const r = await fetch('/api/services/models', { method: 'POST', headers: cfgHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ endpoint_id: !m.key && m.has_key ? m.id : undefined, base_url: m.base_url.trim(), api_key: m.key || undefined, paid: m.paid }) });
    res = r.ok ? await r.json() : { status: 'down' };
  } catch { res = { status: 'down' } }
  if (!su || seq !== m.seq) return;
  m.listState = res.status; m.info = res.status === 'ok' ? res.models || [] : null;
  if (m.info?.length === 1 && !m.model.trim()) { m.model = m.info[0].id; const f = $('[data-sum="model"]'); if (f) f.value = m.model }
  suModelUI();
}
$('#setupView').addEventListener('click', e => {
  const b = e.target.closest('[data-su]'); if (!b || b.disabled || !su) return;
  if (b.dataset.su === 'tryS') { su.typed.searxng = $('#suTypedS').value.trim(); suDiscover() }
  if (b.dataset.su === 'tryJ') { su.typed.jina = $('#suTypedJ').value.trim(); suDiscover() }
  if (b.dataset.su === 'list') suList();
});
$('#setupView').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'suTypedS') $('[data-su="tryS"]').click();
  if (e.target.id === 'suTypedJ') $('[data-su="tryJ"]').click();
});
$('#setupView').addEventListener('change', e => {
  if (!su) return;
  const el = e.target;
  if (el.name === 'suS') su.pick = el.value;
  if (el.id === 'suKeyProv') { su.keyProv = el.value; su.pick = 'key'; $('input[name="suS"][value="key"]').checked = true }
  if (el.dataset.suJina) {
    su.jinaOn = el.checked; if (el.checked) su.jinaUrl = el.dataset.suJina;
    $$('[data-su-jina]').forEach(x => { if (x !== el) x.checked = false });
  }
  if (el.id === 'suPreset') {
    const p = (svc?.llm_presets || []).find(x => x.id === el.value), m = su.llm;
    m.preset = el.value;
    if (p) {
      if (p.base_url) m.base_url = p.base_url;
      m.name = p.id === 'custom' ? '' : p.name; m.paid = !!p.paid; m.info = null; m.listState = ''; m.seq = (m.seq || 0) + 1;
      renderSetup();
      if (m.base_url && !p.key_env) suList(); // a service at home answers without a key
    }
  }
});
$('#setupView').addEventListener('input', e => {
  if (!su) return;
  const el = e.target, f = el.dataset.sum;
  if ($('#setupMsg').classList.contains('bad')) { $('#setupMsg').textContent = ''; $('#setupMsg').className = '' }
  if (el.id === 'suKey') { su.key = el.value.trim(); if (su.key) { su.pick = 'key'; $('input[name="suS"][value="key"]').checked = true } }
  if (el.id === 'suCode') su.code = el.value.trim();
  if (f) {
    su.llm[f] = f === 'key' ? el.value.trim() : el.value;
    if (f !== 'model') { su.llm.info = null; su.llm.listState = ''; su.llm.seq = (su.llm.seq || 0) + 1; suModelUI() }
    else { const box = $('#suModelSt'); if (box && su.llm.listState === 'ok') box.textContent = suModelNote()[1] }
  }
});
$('#suDone').onclick = async () => {
  const msg = $('#setupMsg'), m = su?.llm;
  if (!su) return;
  const say = (k, bad) => { msg.className = bad ? 'bad' : ''; msg.textContent = t(k) };
  const keyed = svcList('search').find(x => x.id === su.keyProv);
  if (!su.pick) return say('su_need_search', true);
  if (su.pick === 'key' && !su.key && !keyed?.has_key) return say('su_need_key', true);
  if (!m.base_url.trim() || !m.model.trim()) return say('su_need_model', true);
  if (su.code && su.code.length < 6) return say('code_short', true);
  const services = {};
  svcList('search').concat(svcList('reader')).forEach(x => { services[x.kind + ':' + x.id] = !!x.on });
  const body = { services, setup_done: true };
  if (su.pick === 'key') {
    services['search:' + su.keyProv] = true; body.default_search_provider = su.keyProv;
    if (su.key) body[KEY_FIELD[su.keyProv]] = su.key;
  } else if ((su.disc?.search || []).find(f => f.url === su.pick)?.provider === 'degoog') {
    services['search:degoog'] = true; body.default_search_provider = 'degoog';
    if (su.pick !== config.degoog_url) body.degoog_url = su.pick;
  } else {
    services['search:searxng'] = true; body.default_search_provider = 'searxng';
    if (su.pick !== config.searxng_url) body.searxng_url = su.pick;
  }
  services['reader:http'] = true; services['reader:jina'] = !!su.jinaOn;
  body.reader_providers = su.jinaOn ? ['http', 'jina'] : ['http'];
  if (su.jinaOn && su.jinaUrl !== config.jina_url) body.jina_url = su.jinaUrl;
  // the other models stay as they are; the one chosen here becomes the default
  const eps = svcList('llm').map(e => ({ id: e.id, name: e.name || e.id, base_url: e.base_url, model: e.model, paid: !!e.paid }));
  const mine = { id: m.id, name: m.name.trim() || m.model.trim(), base_url: m.base_url.trim(), model: m.model.trim(), paid: !!m.paid, api_key: m.key || undefined };
  const i = eps.findIndex(e => e.id === m.id);
  if (i >= 0) eps[i] = mine; else eps.push(mine);
  body.llm_endpoints = eps; body.default_llm_endpoint = m.id;
  say('saving');
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: cfgHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    config = j; dirty = false;
    let codeOk = true;
    if (su.code) {
      try { const rc = await fetch('/api/access', { method: 'POST', headers: cfgHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ access_code: su.code }) }); codeOk = rc.ok } catch { codeOk = false }
      await checkAccess();
    }
    if (!codeOk) return say('su_code_err', true);
    su = null; await loadServices(true); renderSettings(); goHome();
  } catch (err) { msg.className = 'bad'; msg.textContent = t('save_err') + ': ' + err.message }
};
$('#suSkip').onclick = async () => {
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: cfgHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ setup_done: true }) });
    if (r.ok) config = await r.json();
  } catch { }
  su = null; goHome();
};
$('#suRedo').onclick = async () => {
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: cfgHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ setup_done: false }) });
    if (r.ok) config = await r.json();
  } catch { }
  su = null; openSetup();
};

/* ---------- start ---------- */
applyTheme(); applyAccent(root.dataset.palette || 'ambra'); applyTag(root.dataset.tag); applyLang(); syncGo();
const startId = new URLSearchParams(location.search).get('session');
checkAccess().then(ok => {
  if (!ok) return;
  loadConfig(); loadSessions();
  if (startId) openSession(startId, true); else setTimeout(() => $('#q').focus(), 50);
});
setInterval(() => { if (!document.hidden) loadServices() }, 60000);
setInterval(() => { if (!document.hidden && sessions.some(s => s.live)) loadSessions() }, 5000);
})();
</script>
</body>
</html>
